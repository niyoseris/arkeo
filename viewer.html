<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serdarlı — 1 m keşif görüntüleyicisi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;font:13px/1.45 -apple-system,system-ui,sans-serif;background:#141414;color:#e8e8e8}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:12px;right:12px;width:280px;z-index:1000;background:#1c1c1cf2;
         border:1px solid #333;border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px)}
  #panel h1{font-size:14px;margin:0 0 6px;font-weight:600}
  #panel p{margin:0 0 10px;color:#999;font-size:11.5px}
  #coords{font-family:ui-monospace,monospace;font-size:11px;color:#8fd3a8;margin-bottom:8px}
  #list{max-height:280px;overflow:auto;margin-top:10px;border-top:1px solid #333;padding-top:8px}
  .m{font-size:11px;color:#bbb;padding:3px 0;border-bottom:1px solid #262626;cursor:pointer}
  .m b{color:#e8a33d}
  #tip{position:absolute;bottom:12px;left:12px;z-index:1000;background:#1c1c1ce6;border:1px solid #333;
       border-radius:8px;padding:8px 12px;font-size:11.5px;color:#999;max-width:420px}
  .leaflet-container{background:#0d0d0d}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Serdarlı · 350 m kareler</h1>
  <p>Haritaya tıkla → aday işaretle. İşaretler <code>markers.json</code>'a yazılır.</p>
  <div id="coords">imleç: —</div>
  <div id="list"></div>
</div>
<div id="tip">Ara: sırtta düz platform · tarla içinde tarla sınırını aşan çizgi · düzenli taş saçılımı · çukurlu doku (kaya mezar) · teras aralığındaki düzensizlik</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', {zoomControl:true, minZoom:14, maxZoom:18}).setView([35.2525, 33.6008], 14);

L.tileLayer('/tiles/{z}/{x}/{y}.jpg', {
  minZoom:14, maxZoom:18, maxNativeZoom:17, tileSize:256,
  attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics · yalnızca görsel inceleme'
}).addTo(map);

map.on('mousemove', e =>
  document.getElementById('coords').textContent =
  `imleç: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`);

const marks = [];
function draw(m){
  const mk = L.circleMarker([m.lat,m.lon], {radius:6,color:'#e8a33d',weight:2,fillOpacity:.35,fillColor:'#e8a33d'})
    .addTo(map).bindPopup(`<b>${m.type||'aday'}</b><br>${m.note||''}<br><small>E ${m.utm_e} N ${m.utm_n}</small>`);
  marks.push({m,mk}); render();
}
function render(){
  const el = document.getElementById('list');
  el.innerHTML = marks.map((x,i)=>`<div class="m" data-i="${i}"><b>${i+1}.</b> ${x.m.type||'aday'} — E ${x.m.utm_e} N ${x.m.utm_n}</div>`).join('')
    || '<div class="m">henüz işaret yok</div>';
  el.querySelectorAll('.m[data-i]').forEach(d=>d.onclick=()=>{
    const m=marks[+d.dataset.i].m; map.setView([m.lat,m.lon],17);
  });
}

fetch('/markers').then(r=>r.json()).then(a=>a.forEach(draw)).catch(()=>{});

map.on('click', async e=>{
  const type = prompt('Tür? (sit / mezar / teras / duvar / belirsiz)','sit');
  if(type===null) return;
  const note = prompt('Not (kısa):','');
  if(note===null) return;
  const r = await fetch('/mark',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lat:e.latlng.lat, lon:e.latlng.lng, type, note})});
  const j = await r.json();
  draw({lat:e.latlng.lat, lon:e.latlng.lng, type, note, utm_e:j.utm_e, utm_n:j.utm_n});
});
</script>
</body>
</html>
